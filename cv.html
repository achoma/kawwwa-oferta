<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Agnieszka Choma - Web Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">

    <style>

        :root {
            --color-latte: #f0ebe5;
            --color-lungo-d: #d4af9c;
            --color-lungo-d2: #c47d6e;
            --color-lungo-l: #eac4b3;
            --color-white: #f9f8f4;
            --color-text: #3e3a37;
         
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Lato', sans-serif;
        }

        /* RESET & BASE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fff;
            /* Tło podkładki pod "kartkę" */
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 14px;
            line-height: 1.6;
            -webkit-print-color-adjust: exact;
        }

        /* PAGE STRUCTURE (A4 Aspect Ratio) */
        .cv-container {
            max-width: 210mm;
            min-height: 297mm;
            margin: 40px auto;
            background: var(--color-white);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: grid;
            grid-template-columns: 30% 70%;
            /* Układ 2-kolumnowy */
        }

        /* LEFT SIDEBAR (DANE, UMIEJĘTNOŚCI) */
        .sidebar {
            background-color: var(--color-latte);
            color: var(--color-text);
            padding: 30px 20px;
        }

.profile-photo {
            width: 180px;
            height: 180px;
            /* background-color: var(--color-accent); opcjonalnie zostaw jako fallback */
            border-radius: 50%;
            margin: 0 auto 30px auto;
            overflow: hidden;
            border: 4px solid var(--color-lungo-d);
            
            /* ZMIANA: Ścieżka do Twojego pliku */
            background-image: url('images/Agnieszka Choma.png');
            
            background-size: cover;   /* Skaluje zdjęcie, by wypełniło koło */
            background-position: center; /* Centruje zdjęcie */
        }



        .contact-info {
            margin-bottom: 40px;
        }

        .contact-item {
            margin-bottom: 12px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-item a {
            color: var(--color-text);
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-item a:hover {
            color: var(--color-lungo-d2);
        }

        .section-title-sidebar {
            font-family: var(--font-heading);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--color-lungo-d);
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-size: 1.2em;
            color: var(--color-lungo-d2);
        }

        .skills-list {
            list-style: none;
            margin-bottom: 30px;
        }

        .skills-list li {
            margin-bottom: 6px;
            font-size: 0.95em;
        }

        .skill-category {
            font-weight: 600;
            color: var(--color-text);
            text-decoration: underline;
            margin-top: 15px;
            margin-bottom: 5px;
            display: block;
            font-size: 0.95em;
            text-transform: uppercase;
        }

        /* RIGHT CONTENT (DOŚWIADCZENIE) */
        .main-content {
            padding: 40px;
            background-color: var(--color-white);
        }

        .header-name {
            font-family: var(--font-heading);
            color: var(--color-espresso);
        }

        .header-name h1 {
            font-size: 2.5em;
            font-weight: 700;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .header-name h2 {
            font-size: 1.2em;
            font-weight: 400;
            color: var(--color-lungo);
            margin-top: 5px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .summary {
            margin-bottom: 30px;
            color: var(--color-text);
            font-style: italic;
            border-left: 3px solid var(--color-accent);
            padding-left: 15px;
        }

        .section-title-main {
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--color-espresso);
            font-size: 1.3em;
            margin-bottom: 20px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
        }

        .section-title-main::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-latte);
            margin-left: 15px;
            border-bottom: 1px solid var(--color-accent);
        }

        .job-item {
            margin-bottom: 25px;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }

        .job-title {
            font-weight: 700;
            font-size: 1.1em;
            color: var(--color-lungo);
        }

        .job-company {
            font-weight: 600;
            color: var(--color-text);
        }

        .job-date {
            font-size: 0.85em;
            color: #888;
            white-space: nowrap;
        }

        .job-details {
            list-style-type: disc;
            padding-left: 20px;
            margin-top: 8px;
        }

        .job-details li {
            margin-bottom: 4px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 30px;
        }

        .tag {
            background-color: var(--color-latte);
            color: var(--color-espresso);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            border: 1px solid #e0d8c3;
        }

        .education-item {
            margin-bottom: 15px;
        }

        .rodo {
            font-size: 0.6em;
            color: #999;
            margin-top: 40px;
            text-align: justify;
            line-height: 1.3;
        }

        /* PRINT STYLES */
        @media print {
            body {
                background: none;
            }

            .cv-container {
                margin: 0;
                box-shadow: none;
                width: 100%;
                height: 100%;
            }

            /* Wymuszenie drukowania tła (dla ciemnego paska) */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* RESPONSIVE FOR MOBILE VIEWING */
        @media (max-width: 768px) {
            .cv-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar {
                padding: 20px;
                text-align: center;
            }

            .contact-info {
                display: flex;
                flex-direction: column;
                alignItems: center;
            }

            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

   <style>
    /* * SNIPPET NAME: Premium Rose Gold Button (kawwwa.online Style)
 * DESCRIPTION: Przycisk z metalicznym gradientem, subtelnym połyskiem w tle i interaktywnym hoverem.
 * AUTHOR: Wsparcie Koderskie
 * RECYCLING: Zapisz do biblioteki snippetów. Można sprzedawać jako "Premium Button Pack".
 */
body{background-color: #999;
    margin-top: 260px;
    justify-content: center;
    justify-items: center;}

 .kawwwa-rose-btn {
    /* --- BASE STYLES --- */
    background: linear-gradient(135deg, #ba7d70 0%, #f3c5b6 50%, #ba7d70 100%);
    background-size: 200% auto;
    
    color: #ffffff !important;
    font-weight: 700;
    /* [TWEAK] Zwiększyłem lekko tracking liter - to zawsze dodaje elegancji */
    letter-spacing: 1px; 
    text-transform: uppercase; /* Opcjonalnie: WIELKIE LITERY wyglądają pewniej */
    font-size: 14px; /* Jeśli używasz uppercase, zmniejsz nieco font */

    border: none !important; /* ZERO BORDERA */
    
    /* [KLUCZ DO SUKCESU] Gra cieni: */
    /* 1. inset 0 1px... -> To jest ten "Top Highlight" (światło od góry) */
    /* 2. 0 10px 20px... -> To jest miękki cień rzucany na stronę */
    box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        0 8px 20px rgba(186, 125, 112, 0.25); 

    border-radius: 50px;
    padding: 16px 40px;
    
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    z-index: 1;
}

/* --- IDLE ANIMATION (Bez zmian - ten subtelny błysk jest idealny) --- */
.kawwwa-rose-btn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 20%;
    height: 200%;
    background: rgba(255, 255, 255, 0.3);
    transform: rotate(25deg);
    animation: sheenFlow 6s infinite ease-in-out; 
    z-index: -1;
}

@keyframes sheenFlow {
    0% { left: -60%; opacity: 0; }
    10% { opacity: 0.6; } /* Zmniejszyłem opacity, żeby było subtelniej */
    30% { left: 140%; opacity: 0; }
    100% { left: 140%; opacity: 0; }
}

/* --- HOVER STATE --- */
.kawwwa-rose-btn:hover {
    background-position: right center;
    transform: translateY(-2px); /* Delikatne uniesienie */
    
    /* Na hoverze wzmacniamy światło i rozmywamy cień */
    box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.5), /* Mocniejszy błysk na górze */
        0 15px 30px rgba(186, 125, 112, 0.4);   /* Duża, miękka poświata */
}

/* --- ACTIVE STATE (Kliknięcie) --- */
/* To daje uczucie "wciskania" przycisku - super dla UX */
.kawwwa-rose-btn:active {
    transform: translateY(1px);
    box-shadow: 
        inset 0 2px 5px rgba(0,0,0,0.1), /* Wewnętrzny cień sugerujący wklęsłość */
        0 5px 10px rgba(186, 125, 112, 0.3);
}

.kawwwa-rose-btn:hover::after {
    animation: none;
}
.kawwwa-rose-btn2 {
    /* --- BASE STYLES --- */
    background: linear-gradient(135deg, #ba7d70 0%, #f3c5b6 50%, #ba7d70 100%);
    background-size: 200% auto;
    
    color: #ffffff !important;
    font-weight: 700;
    letter-spacing: 0.5px;
    
    /* [NEW] DIAMOND CUT BORDER */
    /* 1px ramka, ale półprzezroczysta biała - wygląda jak krawędź łapiąca światło */
    border: 1px solid rgba(255, 255, 255, 0.4) !important;
    
    /* [NEW] DEPTH EFFECT */
    /* Pierwszy cień to wewnętrzny blask (góra przycisku), drugi to cień zewnętrzny */
    box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.3), /* Wewnętrzny odblask na górze */
        0 5px 15px rgba(186, 125, 112, 0.3);    /* Cień rzucany na tło */

    border-radius: 50px;
    padding: 15px 35px;
    
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    z-index: 1;
}

/* --- IDLE ANIMATION (Bez zmian - działa świetnie) --- */
.kawwwa-rose-btn2::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 20%;
    height: 200%;
    background: rgba(255, 255, 255, 0.4);
    transform: rotate(25deg);
    animation: sheenFlow 7s infinite ease-in-out; 
    z-index: -1;
}

@keyframes sheenFlow {
    0% { left: -60%; opacity: 0; }
    10% { opacity: 0.8; }
    30% { left: 140%; opacity: 0; }
    100% { left: 140%; opacity: 0; }
}

/* --- HOVER STATE (Interakcja) --- */
.kawwwa-rose-btn2:hover,
.kawwwa-rose-btn2:focus {
    background-position: right center;
    color: #ffffff;
    transform: translateY(-3px);
    
    /* [NEW] HOVER BORDER EFFECT */
    /* Na hoverze wzmacniamy border, żeby przycisk stał się bardziej "ostry" */
    border-color: rgba(255, 255, 255, 0.8) !important;
    
    /* Wzmacniamy cienie dla efektu unoszenia */
    box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        0 10px 25px rgba(243, 197, 182, 0.6); 
}

.kawwwa-rose-btn2:hover::after {
    animation: none;
}
   </style>
<div>
    <button class="kawwwa-rose-btn">przycisk</button>
</div><br>
<div>
    <button class="kawwwa-rose-btn2">przycisk2</button>
</div>
</body>

</html>
